<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Northern Spain — Trip in Planning</title>
<style>
  :root{
    --ink:#22303a;
    --ink-soft:#4a5a66;
    --cream:#faf8f3;
    --alpine:#33606f;
    --line:#e3ddd2;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    font-size:19px;line-height:1.65;color:var(--ink);
    background:var(--cream);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,6vw,3rem);line-height:1.15}
  a{color:var(--alpine)}
  a:focus-visible{outline:3px solid var(--alpine);outline-offset:2px;border-radius:2px}
  .wrap{max-width:640px;margin:0 auto;padding:0 20px;text-align:center}
  main{flex:1;display:flex;align-items:center;padding:64px 0}
  .kicker{letter-spacing:.28em;text-transform:uppercase;font-size:.8rem;color:var(--ink-soft);margin-bottom:12px}
  .sub{font-family:var(--serif);font-style:italic;color:var(--ink-soft);margin-top:16px}
  .back{display:inline-block;margin-top:28px;text-decoration:none;font-size:.95rem}
  footer{border-top:1px solid var(--line);padding:24px 0 48px;text-align:center;font-size:.85rem;color:var(--ink-soft)}
</style>
</head>
<body>

<main>
  <div class="wrap">
    <p class="kicker">In planning</p>
    <h1>Northern Spain</h1>
    <p class="sub">The route, dates, and highlights are still taking shape &mdash; the full plan will appear here once it's ready.</p>
    <a class="back" href="../">&larr; Back to all trips</a>
  </div>
</main>

<footer>Made with love for the family.</footer>

</body>
</html>
